# Every push to main that changes the app becomes an update for the group's
# laptops: test, build the Windows app, package the installer and publish it as
# a GitHub release. The app's updater looks for the newest release.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "installer/**"
      - "firmware/ecoearn/**"
      - ".github/workflows/release.yml"
  workflow_dispatch: # also a "Run workflow" button on the Actions tab

permissions:
  contents: write # to create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Visual Studio 2022, like the development laptop (windows-latest moved to VS 2026).
    runs-on: windows-2022
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: arduino/setup-arduino-cli@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9 # same as app/.fvmrc
          channel: stable
          cache: true

      - name: Version
        id: version
        run: |
          $v = "1.0.${{ github.run_number }}"
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing EcoEarn $v"

      - name: Get packages
        run: flutter pub get

      - name: Test (a failing test stops the release)
        run: flutter test

      - name: Build
        run: >
          flutter build windows --release
          --build-name=${{ steps.version.outputs.value }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.version.outputs.value }}

      - name: Compile the machine firmware
        # Shipped with the app, which flashes it onto the ESP32 ("Update machine").
        working-directory: .
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "MFRC522@1.4.12" "HX711 Arduino Library@0.7.5"
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/ecoearn --output-dir fwbuild
          $fw = "app/build/windows/x64/runner/Release/firmware"
          New-Item -ItemType Directory -Force $fw | Out-Null
          Copy-Item fwbuild/ecoearn.ino.bin "$fw/ecoearn.bin"
          $version = (Select-String -Path firmware/ecoearn/config.h -Pattern '#define FIRMWARE_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          Set-Content -Path "$fw/version.txt" -Value $version -NoNewline
          $esptool = Get-ChildItem "$env:LOCALAPPDATA/Arduino15/packages/esp32/tools/esptool_py/*/esptool.exe" | Select-Object -First 1
          Copy-Item $esptool.FullName $fw
          Write-Host "Bundled firmware $version"

      - name: Add the Visual C++ runtime next to the app
        # So it runs on laptops that don't have Microsoft's runtime installed.
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }

      - name: Package the installer
        working-directory: .
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=$PWD\app\build\windows\x64\runner\Release" installer\ecoearn.iss

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: EcoEarn ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: dist/EcoEarn-${{ steps.version.outputs.value }}-Setup.exe
